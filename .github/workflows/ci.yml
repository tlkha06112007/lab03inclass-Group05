name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  assistant-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant_core_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant_core_lab/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: ruff check .
      - run: pytest -q